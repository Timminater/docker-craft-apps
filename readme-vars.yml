---

# project information
project_name: craft-apps
project_url: "https://getartcraft.com/"
project_logo: "https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/artcraft-logo.png"
project_blurb: "[ArtCraft]({{ project_url }}) is a suite of open source creative applications written in Rust. This image bundles PhotoCraft (image editor), VectorCraft (vector illustration), FilmCraft (video editor), LightCraft (photo library and raw developer), PdfCraft (PDF workbench), EffectCraft (motion graphics and VFX compositor), DesignCraft (page layout and publishing), FigCraft (interface design), WordCraft (word processing), SoundCraft (audio workstation), DeckCraft (presentations), CADCraft (computer-aided design) and GridCraft (spreadsheets) in a single desktop."
project_lsio_github_repo_url: "https://github.com/linuxserver/docker-{{ project_name }}"
project_blurb_optional_extras_enabled: false
project_categories: "Image Editor,Video Editor, Media Tools"
# supported architectures
available_architectures:
  - {arch: "{{ arch_x86_64 }}", tag: "latest"}
  - {arch: "{{ arch_arm64 }}", tag: "arm64v8-latest"}
# container parameters
common_param_env_vars_enabled: true
param_container_name: "{{ project_name }}"
param_usage_include_vols: true
param_volumes:
  - {vol_path: "/config", vol_host_path: "/path/to/{{ project_name }}/config", desc: "Users home directory in the container, stores local files and settings"}
param_usage_include_ports: true
param_ports:
  - {external_port: "3000", internal_port: "3000", port_desc: "HTTP Craft Apps desktop gui, must be proxied."}
  - {external_port: "3001", internal_port: "3001", port_desc: "HTTPS Craft Apps desktop gui."}
custom_params:
  - {name: "shm-size", name_compose: "shm_size", value: "1gb", desc: "This is needed for the applications and websites to function properly."}
# Selkies blurb settings
selkies_blurb: true
show_nvidia: true
# application setup block
app_setup_block_enabled: true
app_setup_block: |
  **This community fork is no longer maintained as of 15 October 2026.** All further development takes place in [Docker Craft Portal](https://github.com/Timminater/docker-craft-portal). No further app updates, fixes or security updates are planned for this fork. The instructions below are retained for reference only.

  The application can be accessed at:

  * https://yourhost:3001/

  Apps from the official catalog at https://getartcraft.com/apps are included. The verified release inventory is recorded in root/defaults/craft-releases.json. GitHub Actions checks the catalog and latest stable releases on each build, commits compatible new apps and version changes, and builds native x86-64 and ARM64 images from that same inventory. New apps must provide both Debian packages and the expected desktop launcher; incompatible changes fail for manual review. Apps are never automatically removed.

  Images are published at ghcr.io/timminater/docker-craft-apps:latest (both architectures), with amd64-latest and arm64v8-latest aliases. Automatic push and scheduled builds have stopped; the workflow is retained for explicit manual dispatch only. Startup, installed package versions and restart with existing /config are checked before publishing. The multi-architecture latest tag is only updated after both architectures succeed.

  Example:

  ```bash
  docker run -d --name craft-apps --security-opt seccomp=unconfined --shm-size=1g -e PUID=1000 -e PGID=1000 -e TZ=Europe/Amsterdam -p 3001:3001 -v /path/to/craft-apps/config:/config ghcr.io/timminater/docker-craft-apps:latest
  ```

  Publishing uses the repository GITHUB_TOKEN; no registry password or personal access token needs to be configured. GitHub initially creates personal GHCR packages as private: the owner can authenticate to pull them or change package visibility to public in the package settings for anonymous pulls. A failed update/build is reported in Actions and leaves the existing latest image available.

  When building locally without CRAFT_RELEASES, each image build resolves the latest stable GitHub release independently for each app (PhotoCraft can be overridden with PHOTOCRAFT_RELEASE). Rebuild with --pull --no-cache to refresh all apps; restarting an existing container does not update the installed apps.

  This is a community fork. The linuxserver/craft-apps images in the generated examples are published by upstream; use the GHCR image above for this fork.

# init diagram
init_diagram: |
  "craft-apps:latest": {
    docker-mods
    base {
      fix-attr +\nlegacy cont-init
    }
    docker-mods -> base
    legacy-services
    custom services
    init-services -> legacy-services
    init-services -> custom services
    custom services -> legacy-services
    legacy-services -> ci-service-check
    init-migrations -> init-adduser
    init-os-end -> init-config
    init-selkies-end -> init-config
    init-config -> init-config-end
    init-crontab-config -> init-config-end
    init-config -> init-crontab-config
    init-mods-end -> init-custom-files
    init-adduser -> init-device-perms
    base -> init-envfile
    base -> init-migrations
    init-config-end -> init-mods
    init-mods-package-install -> init-mods-end
    init-mods -> init-mods-package-install
    init-selkies -> init-nginx
    init-adduser -> init-os-end
    init-device-perms -> init-os-end
    init-envfile -> init-os-end
    init-os-end -> init-selkies
    init-nginx -> init-selkies-config
    init-video -> init-selkies-end
    init-custom-files -> init-services
    init-selkies-config -> init-video
    init-services -> svc-cron
    svc-cron -> legacy-services
    init-services -> svc-dbus
    svc-xorg -> svc-dbus
    svc-dbus -> legacy-services
    init-services -> svc-de
    legacy-cont-init -> svc-de
    svc-nginx -> svc-de
    svc-selkies -> svc-de
    svc-xorg -> svc-de
    svc-de -> legacy-services
    init-services -> svc-docker
    svc-docker -> legacy-services
    init-services -> svc-nginx
    svc-nginx -> legacy-services
    init-services -> svc-pulseaudio
    svc-pulseaudio -> legacy-services
    init-services -> svc-selkies
    svc-nginx -> svc-selkies
    svc-pulseaudio -> svc-selkies
    svc-xorg -> svc-selkies
    svc-selkies -> legacy-services
    init-services -> svc-watchdog
    svc-watchdog -> legacy-services
    init-services -> svc-xorg
    svc-xorg -> legacy-services
    init-services -> svc-xsettingsd
    svc-nginx -> svc-xsettingsd
    svc-xorg -> svc-xsettingsd
    svc-xsettingsd -> legacy-services
  }
  Base Images: {
    "baseimage-selkies:ubunturesolute" <- "baseimage-ubuntu:resolute"
  }
  "craft-apps:latest" <- Base Images
# changelog
changelogs:
  - {date: "15.10.26:", desc: "Build and test native multi-architecture GHCR images with weekly app catalog and release updates."}
  - {date: "15.10.26:", desc: "Include all thirteen Craft apps on x86-64 and ARM64 with desktop shortcuts and menus; fail builds on release download errors."}
  - {date: "11.10.26:", desc: "Initial release."}
