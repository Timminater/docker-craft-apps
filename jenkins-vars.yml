---

# jenkins variables
project_name: docker-craft-apps
external_type: github_stable
release_type: stable
release_tag: latest
ls_branch: master
build_armhf: false
repo_vars:
  - EXT_GIT_BRANCH = 'main'
  - EXT_USER = 'storytold'
  - EXT_REPO = 'photocraft'
  - BUILD_VERSION_ARG = 'PHOTOCRAFT_RELEASE'
  - LS_USER = 'linuxserver'
  - LS_REPO = 'docker-craft-apps'
  - CONTAINER_NAME = 'craft-apps'
  - DOCKERHUB_IMAGE = 'linuxserver/craft-apps'
  - DEV_DOCKERHUB_IMAGE = 'lsiodev/craft-apps'
  - PR_DOCKERHUB_IMAGE = 'lspipepr/craft-apps'
  - DIST_IMAGE = 'ubuntu'
  - MULTIARCH = 'true'
  - CI = 'true'
  - CI_WEB = 'true'
  - CI_PORT = '3001'
  - CI_SSL = 'true'
  - CI_DELAY = '120'
  - CI_DOCKERENV = 'TZ=US/Pacific'
  - CI_AUTH = 'user:password'
  - CI_WEBPATH = ''
